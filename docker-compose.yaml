services:

  app:
    build:
      dockerfile: Dockerfile
    image: giaa_emt/app:latest
    container_name: emt_app

    ports:
      - 3000:3000

    volumes:

      - ./WEB_DEVEL/data/logs:/app/WEB_DEVEL/data/logs

      - ./WEB_DEVEL/data/known_data:/app/WEB_DEVEL/data/known_data:ro


    restart: unless-stopped

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: 12
          memory: "14G"
